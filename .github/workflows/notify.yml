name: Status notify

on:
  schedule:
    # Monday 02:00 UTC = Monday 10:00 Asia/Shanghai
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: notify-state-v3-${{ github.run_id }}
          restore-keys: |
            notify-state-v3-

      - name: Send weekly digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          STATE_PATH: .state/notify-state.json
          # A manual dispatch always sends a mail so the chain can be verified.
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/status-notify.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: notify-state-v3-${{ github.run_id }}
